{% load static %}

<nav class="bank-navbar">
    <div class="site-container bank-navbar-inner">

        <a class="bank-brand" href="{% url 'home' %}">
            <img class="bank-logo-image" src="{% static 'logo/batman_logo.png' %}" alt="">
            <span><strong>GothamCity Bank</strong><small>PRIVATE BANKING</small></span>
        </a>

        <button class="nav-toggle" type="button" aria-controls="mainNav" aria-expanded="false" aria-label="Open navigation">
            <span></span><span></span><span></span>
        </button>

        <div class="bank-nav-content" id="mainNav">
            {% if user.is_authenticated %}
                <div class="bank-actions">
                    <a href="{% url 'withdraw' %}">Withdraw</a>
                    <a href="{% url 'deposite' %}">Deposit</a>
                    <a href="{% url 'loan_request' %}">Loan</a>
                    <a href="{% url 'transfer_money' %}">Transfer</a>
                </div>
            {% endif %}

            <div class="bank-account-nav">
                <a href="{% url 'home' %}">Home</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">Profile</a>
                    <span class="nav-user">{{ user.first_name|default:user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-logout">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a class="nav-register" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
